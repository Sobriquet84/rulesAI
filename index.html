<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Embracing AI | The Practical Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F7FC;--surface:#FFFFFF;--tint:#F2EDFF;--tint2:#E6DCFC;
  --text:#220C3D;--text2:#49385C;--muted:#6B617A;--line:#E5DEF0;
  --purple:#5A22E8;--purple-t:#5A22E8;
  --blue:#196DFA;--blue-t:#196DFA;
  --magenta:#B63BC8;--magenta-t:#A12FB4;
  --pink:#FF7AA4;--cyan:#1FCDE0;--ink:#220C3D;
  --hero-a:#EFE7FF;--hero-b:#DCE8FF;
  --focus:#196DFA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14091F;--surface:#1E1030;--tint:#2A1846;--tint2:#36215A;
    --text:#F2EDFF;--text2:#D3C9E8;--muted:#A99DC2;--line:#3A2757;
    --purple-t:#B9A0FF;--blue-t:#7FAEFF;--magenta-t:#E08BF0;
    --ink:#2A1846;--hero-a:#241341;--hero-b:#14243F;--focus:#7FAEFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14091F;--surface:#1E1030;--tint:#2A1846;--tint2:#36215A;
  --text:#F2EDFF;--text2:#D3C9E8;--muted:#A99DC2;--line:#3A2757;
  --purple-t:#B9A0FF;--blue-t:#7FAEFF;--magenta-t:#E08BF0;
  --ink:#2A1846;--hero-a:#241341;--hero-b:#14243F;--focus:#7FAEFF;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p,ol,ul,figure{margin:0}
h1:focus{outline:none}
ul,ol{padding:0;list-style:none}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;flex:none;text-decoration:none}
.brand img{height:30px;width:auto}
.logo-l{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-d{display:none}:root:not([data-theme="light"]) .logo-l{display:block}}
:root[data-theme="dark"] .logo-d{display:none}
:root[data-theme="dark"] .logo-l{display:block}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.nav a{white-space:nowrap;text-decoration:none;font-size:.9375rem;font-weight:550;color:var(--text2);padding:8px 12px;border-bottom:3px solid transparent}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);border-bottom-color:var(--purple)}
@media (max-width:760px){.top .wrap{gap:4px}.nav{margin-left:0;width:100%}}

/* type */
.tag{font-size:.9rem;font-weight:600;color:var(--purple-t)}
h1{font-weight:800;letter-spacing:-.03em;line-height:1.05}
h2{font-size:clamp(1.65rem,3.2vw,2.3rem);font-weight:700;letter-spacing:-.02em;line-height:1.15}
h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.lede{color:var(--text2);font-size:1.125rem;max-width:58ch}
.small{font-size:.9rem;color:var(--muted)}

/* chapter accents */
.ch-safe{--ac:var(--blue);--ac-t:var(--blue-t)}
.ch-prompting{--ac:var(--purple);--ac-t:var(--purple-t)}
.ch-automation{--ac:var(--magenta);--ac-t:var(--magenta-t)}
.ch-cheatsheet{--ac:var(--purple);--ac-t:var(--purple-t)}

/* view enter */
.enter{animation:enter .2s ease-out}
@keyframes enter{from{opacity:0}to{opacity:1}}

/* home hero */
.hero{background:linear-gradient(115deg,var(--hero-a),var(--hero-b));}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,64px);align-items:center;padding-top:clamp(32px,6vw,72px);padding-bottom:clamp(32px,6vw,72px)}
.hero h1{font-size:clamp(3rem,8vw,5.6rem);margin:12px 0 18px}
.pill{display:inline-block;background:var(--purple);color:#fff;font-weight:700;border-radius:999px;padding:8px 22px;font-size:1.1rem}
.hero .tagline{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:26px 0 14px}
.hero-art{position:relative;justify-self:end;width:100%;max-width:440px}
.hero-art::before{content:"";position:absolute;width:34%;aspect-ratio:1;border-radius:50%;background:var(--pink);right:-6%;bottom:-7%;z-index:0}
.hero-art img{position:relative;z-index:1;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px;box-shadow:0 24px 48px -24px rgba(34,12,61,.45)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero-art{max-width:340px;justify-self:start}}

/* sections */
.sec{padding:clamp(36px,6vw,72px) 0}
.sec-head{display:grid;gap:10px;margin-bottom:28px}
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.paths{grid-template-columns:1fr}}
.path{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ac);border-radius:6px;padding:22px 22px 20px;min-height:230px;transition:transform .15s ease,box-shadow .15s ease}
.path:hover{transform:translateY(-3px);box-shadow:0 14px 28px -16px rgba(34,12,61,.35)}
.path .num{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;color:var(--ac-t);line-height:1}
.path p{color:var(--text2)}
.go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-weight:650;color:var(--ac-t);font-size:.95rem}
.go svg{transition:transform .15s ease}
.path:hover .go svg,.tile:hover .go svg{transform:translateX(4px)}
.strip{margin-top:18px;background:var(--ink);color:#fff;border-radius:6px;padding:26px clamp(20px,3vw,32px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.strip p{color:#D9CFEF;max-width:52ch}
.strip h3{font-size:1.4rem;margin:2px 0 6px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--purple);color:#fff;text-decoration:none;border:0;border-radius:999px;padding:12px 22px;font-weight:650}
.btn:hover{filter:brightness(1.1)}
.btn.light{background:#fff;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--purple-t);filter:none}

/* chapter hero */
.chap{background:var(--purple);color:#fff}
.chap .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,56px);align-items:center;padding-top:clamp(28px,5vw,60px);padding-bottom:clamp(28px,5vw,60px)}
.chap .tag{color:#1FCDE0}
.chap .big{font-size:clamp(3.4rem,9vw,6rem);font-weight:800;letter-spacing:-.05em;line-height:1;margin:14px 0 6px}
.chap h1{font-size:clamp(2.1rem,5vw,3.6rem)}
.chap .lede{color:#E9E1FF;margin-top:16px}
.chap .lede em{font-style:normal;font-weight:650;color:#1FCDE0}
.chap-art{position:relative;max-width:420px;width:100%;justify-self:end}
.chap-art::before{content:"";position:absolute;width:36%;aspect-ratio:1;border-radius:50%;background:var(--pink);left:-8%;bottom:-8%}
.chap-art img{position:relative;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:28px;border:8px solid #fff}
@media (max-width:820px){.chap .wrap{grid-template-columns:1fr}.chap-art{justify-self:start;max-width:340px}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:6px;padding:18px 20px;min-height:170px;transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(34,12,61,.35)}
.tile .k{font-size:.85rem;font-weight:600;color:var(--ac-t)}
.tile h3{font-size:1.1rem}
.tile p{font-size:.95rem;color:var(--text2)}
.tile .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.seen{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:600;color:var(--muted)}

/* topic view */
.crumbs{padding:22px 0 6px;font-size:.92rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{color:var(--text2);font-weight:600}
.switch{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px}
.switch a{white-space:nowrap;text-decoration:none;font-size:.88rem;font-weight:600;color:var(--text2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.switch a:hover{border-color:var(--ac)}
.switch a[aria-current="page"]{background:var(--ac);border-color:var(--ac);color:#fff}
.topic-head{padding:26px 0 8px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-bottom:28px;padding-bottom:26px}
.topic-head .tag{color:var(--ac-t)}
.topic-head h1{font-size:clamp(2rem,4.6vw,3.2rem);max-width:20ch}
.topic-body{display:grid;gap:22px;padding-bottom:12px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:28px 0 56px}

/* shared blocks */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}}
@media (max-width:640px){.grid2,.grid4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:6px;padding:20px 22px;display:grid;gap:8px}
.card p{color:var(--text2)}
.card .k{font-size:.85rem;font-weight:600;color:var(--ac-t)}
.card.solid{background:var(--purple);border-color:var(--purple);color:#fff}
.card.solid p,.card.solid .k{color:#E9E1FF}
.card.alt{--ac:var(--blue)}
.lab{font-size:.85rem;font-weight:650;color:var(--ac-t)}
.banner{background:var(--purple);color:#fff;border-radius:6px;padding:16px 22px;display:flex;gap:10px 18px;flex-wrap:wrap;align-items:baseline}
.banner strong{font-size:.9rem;font-weight:700;color:#D9CCFF}
.banner span{font-weight:550}
.banner a{color:#fff;font-weight:700;text-underline-offset:3px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 20px 22px;display:grid;gap:8px;align-content:start}
.step p{color:var(--text2);font-size:.98rem}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--blue)}
.steps .step:nth-child(6n+2) .dot{background:var(--purple)}
.steps .step:nth-child(6n+3) .dot{background:var(--magenta)}
.steps .step:nth-child(6n+4) .dot{background:var(--ink)}
.steps .step:nth-child(6n+5) .dot{background:var(--blue)}
.steps .step:nth-child(6n+6) .dot{background:var(--purple)}
.step b{font-weight:700;color:var(--text)}

/* reveal */
.rv-top{display:flex;justify-content:flex-end}
.link-btn{background:none;border:0;font-weight:650;font-size:.92rem;color:var(--ac-t);padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.rv-grid.one{grid-template-columns:1fr}
.rv-grid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.rv-grid.three{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.rv-grid,.rv-grid.three{grid-template-columns:1fr}}
.rv{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:6px}
.rv-btn{width:100%;display:flex;gap:14px;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;padding:16px 18px;font-weight:650;line-height:1.35}
.rv-btn .lead{display:flex;gap:12px;align-items:center}
.rv-btn .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:700}
.rv-btn .ic{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--ac-t);display:grid;place-items:center;transition:transform .2s ease}
.rv.open .rv-btn .ic{transform:rotate(45deg)}
.rv-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.rv.open .rv-p{grid-template-rows:1fr}
.rv-in{overflow:hidden;visibility:hidden;transition:visibility 0s .22s}
.rv.open .rv-in{visibility:visible;transition:visibility 0s 0s}
.rv-body{padding:0 18px 18px;display:grid;gap:12px;color:var(--text2)}
.rv-body .ans{color:var(--text);font-weight:500}

/* copy block */
.copy{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;background:var(--tint);border-left:4px solid var(--ac);border-radius:4px;padding:14px 16px}
.ptext{font-weight:500;color:var(--text);flex:1}
.copy-btn{flex:none;display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:650;color:var(--text)}
.copy-btn:hover{border-color:var(--ac)}
@media (max-width:520px){.copy{flex-direction:column}}

/* tcrei */
.tc{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:640px}
.tc button{background:none;border:0;display:grid;gap:8px;justify-items:center;padding:6px 2px;font-weight:650;font-size:.8rem;color:var(--text2)}
.tc .ltr{width:clamp(52px,9vw,72px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(1.4rem,3vw,1.9rem);font-weight:700;color:#fff;background:var(--blue);outline:0 solid transparent;outline-offset:0;transition:outline-width .12s ease}
.tc button:nth-child(2) .ltr{background:var(--purple)}
.tc button:nth-child(3) .ltr{background:var(--magenta)}
.tc button:nth-child(4) .ltr{background:var(--blue)}
.tc button:nth-child(5) .ltr{background:var(--purple)}
.tc button[aria-pressed="true"]{color:var(--text)}
.tc button[aria-pressed="true"] .ltr{outline:4px solid var(--pink)}
.tc-panel{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--purple);border-radius:6px;padding:22px 24px;display:grid;gap:6px}
.tc-panel .w{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}

/* vague vs clear */
.vc{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
.vc[data-open="false"]{grid-template-columns:1fr}
.vc[data-open="false"] .vc-arrow,.vc[data-open="false"] .vc-clear{display:none}
.vc-arrow{display:grid;place-items:center;background:var(--purple);color:#fff;border-radius:6px;padding:0 12px}
.vc .card{height:100%}
.vc .quote{font-size:1.25rem;font-weight:650;color:var(--text);line-height:1.35}
.vc-vague{--ac:var(--pink)}
.vc-vague .k{color:var(--muted)}
@media (max-width:760px){.vc,.vc[data-open="false"]{grid-template-columns:1fr}.vc-arrow{padding:8px;transform:rotate(90deg)}}

/* lists */
.checks li,.plain li{position:relative;padding-left:26px;color:var(--text2);margin:6px 0}
.checks li::before{content:"";position:absolute;left:2px;top:.45em;width:12px;height:7px;border-left:3px solid var(--ac);border-bottom:3px solid var(--ac);transform:rotate(-45deg)}
.plain li::before{content:"";position:absolute;left:6px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.quote{font-weight:500;color:var(--text)}

/* footer */
.foot-bar{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.9rem}
.foot-bar .wrap{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.foot-bar img{height:22px;width:auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

:root{--g:#1F9D6B;--y:#E0A100;--r:#D6383E;--g-bg:#DDF5EA;--g-fg:#0B6B45;--y-bg:#FFF0C7;--y-fg:#7A5200;--r-bg:#FFE0E2;--r-fg:#A3171C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#3CC08C;--y:#F2B93B;--r:#F26A70;--g-bg:#123828;--g-fg:#86E3B8;--y-bg:#3F3110;--y-fg:#F6CF6C;--r-bg:#4A1A1E;--r-fg:#FFA3A8}}
:root[data-theme="dark"]{--g:#3CC08C;--y:#F2B93B;--r:#F26A70;--g-bg:#123828;--g-fg:#86E3B8;--y-bg:#3F3110;--y-fg:#F6CF6C;--r-bg:#4A1A1E;--r-fg:#FFA3A8}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:700;white-space:nowrap;justify-self:start}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip.y i{border-radius:2px;transform:rotate(45deg)}
.chip.r i{border-radius:0;clip-path:polygon(0 0,100% 0,50% 100%)}
.chip.g{background:var(--g-bg);color:var(--g-fg)}.chip.y{background:var(--y-bg);color:var(--y-fg)}.chip.r{background:var(--r-bg);color:var(--r-fg)}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:860px){.tiers{grid-template-columns:minmax(0,1fr)}}
.tier.tg{border-top-color:var(--g)}.tier.ty{border-top-color:var(--y)}.tier.tr{border-top-color:var(--r)}
.tier h3{font-size:1.1rem}.tier .ans{color:var(--text);font-weight:600}
</style>
</head>
<body>

     rv('Could this influence a personnel decision?','<p class="ans">Keep the decision fully human.</p>')].join(''))
     +`<div class="banner"><strong>If you are unsure</strong><span>Stop and ask Risk &amp; Compliance.</span></div>`}
 ]},
 prompting:{n:'02',nav:'Get better answers',short:'Prompting',tag:'Part two / Prompting',title:['Better answers','start here.'],
  home:'Prompts, examples, checks and resets.',
  lede:'Learn to guide and refine AI responses for <em>stronger ideas, better drafts and less rework.</em>',img:IMG.BUBBLE,alt:'A purple speech bubble with a pink question mark',
  topics:[
  {id:'tcrei',tag:'Your core method',title:'Meet TCREI: the five-move prompting loop.',teaser:'One memorable method to turn a vague ask into a genuinely useful result.',
   body:()=>`<div class="tc" role="group" aria-label="TCREI steps">
     <button type="button" data-tc="0" aria-pressed="true"><span class="ltr">T</span>Task</button>
     <button type="button" data-tc="1" aria-pressed="false"><span class="ltr">C</span>Context</button>
     <button type="button" data-tc="2" aria-pressed="false"><span class="ltr">R</span>References</button>
     <button type="button" data-tc="3" aria-pressed="false"><span class="ltr">E</span>Evaluate</button>
     <button type="button" data-tc="4" aria-pressed="false"><span class="ltr">I</span>Iterate</button></div>
     <div class="tc-panel" aria-live="polite"><p class="w" id="tcW">Task</p><p id="tcD" class="lede">Say exactly what you want.</p></div>`
     +copyBlock('Copy this starter','“I need [task]. The audience is [audience]. Use [format]. Priorities are [constraints].”')},
  {id:'brief',tag:'See the difference',title:'The same task. A much better brief.',teaser:'Your first prompt does not have to be clever. It has to be clear.',
   body:()=>`<div class="vc" data-open="false">
     <div class="card vc-vague"><p class="k">Vague prompt</p><p class="quote">“Summarise this report.”</p><p class="small">No audience. No purpose. No useful guardrails.</p></div>
     <div class="vc-arrow" aria-hidden="true">${ARROW}</div>
     <div class="card vc-clear"><p class="k">Clear prompt</p><p class="quote">“Write a 150-word summary for senior leaders. Reference material: [insert material]. Focus on the decision, main risk and recommended next step. Use plain language.”</p></div></div>
     <div><button class="btn" type="button" data-clear aria-expanded="false">Show the clearer brief</button></div>
     <div class="banner"><strong>The point</strong><span>Name the task, the reader, the format and the definition of a good result.</span></div>`},
  {id:'order',tag:'Before you hit send',title:'Put the most important thing where it can be seen.',teaser:'Structure your ask so the model does not have to hunt for what matters.',
   body:()=>`<ol class="steps">
     <li class="step"><span class="dot">1</span><h3>Task first</h3><p><b>Lead with the goal.</b></p><p>What you need the model to do.</p></li>
     <li class="step"><span class="dot">2</span><h3>Useful context</h3><p><b>Give only what is relevant.</b></p><p>Audience, material and constraints.</p></li>
     <li class="step"><span class="dot">3</span><h3>Success criteria</h3><p><b>Finish with the standard.</b></p><p>Length, format, priorities and checks.</p></li></ol>
     <div class="banner"><strong>Why it helps</strong><span>Long inputs can cause key information to get lost in the middle. Make the goal and the final requirements easy to find.</span></div>`},
  {id:'specific',tag:'Get specific',title:'Tell AI what should happen, not what it might try.',teaser:'Firm direction and positive instructions reduce unnecessary back-and-forth.',
   body:()=>`<div class="grid2">
     <div class="card"><p class="k">Make it firm</p><p class="quote">“The summary must be under 100 words.”</p></div>
     <div class="card"><p class="k">Make it positive</p><p class="quote">“Use plain, everyday words.”</p></div>
     <div class="card"><p class="k">Show the priorities</p><p class="quote">“1. Don’t invent facts. 2. Max 200 words. 3. Friendly tone.”</p></div>
     <div class="card"><p class="k">Make boundaries clear</p><p>Separate your instructions from reference material using a divider or labelled block.</p></div></div>
     <div class="banner"><strong>A useful swap</strong><span>Replace “try to” or “if possible” with the requirement itself.</span></div>`},
  {id:'examples',tag:'Make the pattern visible',title:'Show what good looks like. Then work in steps.',teaser:'A good example can say more about tone and quality than a long list of adjectives.',
   body:()=>`<div class="grid2">
     <div class="card"><p class="k">Step one / Give an example</p><h3>Instead of saying “professional but warm”, show a short piece of writing in the right voice.</h3><p>Use representative examples. Mark good and bad examples clearly. Avoid examples that contradict each other.</p></div>
     <div class="card"><p class="k">Step two / Break it up</p>
       <ol class="steps" style="grid-template-columns:1fr;gap:8px">
       <li style="display:flex;gap:12px;align-items:center"><span class="dot" style="width:30px;height:30px;font-size:.9rem">1</span><b>Welcome the new hire</b></li>
       <li style="display:flex;gap:12px;align-items:center"><span class="dot" style="width:30px;height:30px;font-size:.9rem;background:var(--purple)">2</span><b>Share first-day logistics</b></li>
       <li style="display:flex;gap:12px;align-items:center"><span class="dot" style="width:30px;height:30px;font-size:.9rem;background:var(--magenta)">3</span><b>Summarise week-one goals</b></li>
       <li style="display:flex;gap:12px;align-items:center"><span class="dot" style="width:30px;height:30px;font-size:.9rem;background:var(--ink)">4</span><b>Close with where to get help</b></li></ol></div></div>
     <div class="banner"><strong>For harder tasks</strong><span>Ask for an outline first, then approve it before drafting the full document.</span></div>`},
  {id:'pressure',tag:'Before you use the answer',title:'Do not just read the answer. Pressure-test it.',teaser:'Ask for information you can verify, then actively challenge the conclusion.',
   body:()=>`<div class="grid2">
     <div class="card"><p class="k">Ask AI to show...</p><ul class="checks"><li>Assumptions</li><li>Criteria it considered</li><li>Evidence supporting the conclusion</li><li>Key trade-offs</li><li>Checkable calculations</li><li>Unknowns or missing information</li></ul></div>
     <div class="card solid"><p class="k">Then challenge it</p><p class="quote" style="color:#fff;font-size:1.2rem">“Find the cracks. Give the counter-view. Name the risks. Check consistency. Separate facts, inferences, assumptions and unknowns.”</p></div></div>`
     +copyBlock('Copy this check','“State assumptions, trade-offs and evidence. Then recommend a next step in five bullets or fewer.”')},
  {id:'offtrack',tag:'Troubleshooting',title:'When AI goes off-track, steer it back.',teaser:'Try these prompts instead of starting from scratch every time.',
   body:()=>`<p class="lede" style="margin-bottom:-6px">Tap what you are seeing to get a prompt that fixes it.</p>`+rvWrap([
     rv('It guesses',copyBlock('Try this','“If anything is ambiguous, check with me before answering.”')),
     rv('It sounds too certain',copyBlock('Try this','“If you do not have solid information, flag it clearly.”')),
     rv('It agrees too quickly',copyBlock('Try this','“Give me your assessment, not agreement for the sake of agreement.”')),
     rv('It drifts away',copyBlock('Try this','“Re-evaluate from scratch and restate our original goal.”'))].join(''))
     +`<div class="banner"><strong>Two extra levers</strong><span>Ask for a different perspective (“act as a sceptical reviewer”) and improve one section at a time.</span></div>`},
  {id:'reset',tag:'When to reset',title:'Sometimes the best prompt is a new chat.',teaser:'A fresh start can remove confusion created by outdated or conflicting context.',
   body:()=>`<div class="grid3">
     <div class="card"><span class="dot">1</span><h3>The goal changes</h3><p>A new task deserves a clean brief.</p></div>
     <div class="card"><span class="dot" style="background:var(--purple)">2</span><h3>Errors keep returning</h3><p>Old mistakes may continue to influence the answer.</p></div>
     <div class="card"><span class="dot" style="background:var(--magenta)">3</span><h3>Context is stale</h3><p>Most of the conversation no longer matters.</p></div></div>`
     +copyBlock('Copy / paste hand-off','“We’re continuing this in a new chat. Write a self-contained hand-off with the goal and status; decisions and constraints; what is done and still open; and the recommended next step.”')}
 ]},
 automation:{n:'03',nav:'Automate responsibly',short:'Automation',tag:'Part three / Automations',title:['Automate effort.','Keep judgement.'],
  home:'Choose, map, control, pilot and learn.',
  lede:'Learn what to automate and where people stay in control, <em>so you can save time without compromising oversight.</em>',img:IMG.BLOCKS,alt:'Wooden blocks with people icons connected by string',
  topics:[
  {id:'choose',tag:'Automation / Choose',title:'Choose the right first task.',teaser:'Start with low-risk work that is frequent, predictable and easy for a person to verify.',
   body:()=>`<div class="grid2">
     <div class="card"><p class="k">Green flags</p><h3>High fit. Low risk.</h3><ul class="checks"><li>Repetitive and frequent</li><li>Consistent and easy to describe</li><li>Reliable inputs</li><li>Easy to evaluate</li><li>Safe enough to test</li></ul></div>
     <div class="card"><p class="k">Ask before automating</p><h3>What if the result is wrong?</h3><p>Can the action be reversed? Does it affect employees, customers, sensitive data, or legal, financial or reputational commitments?</p></div></div>
     <div class="banner"><strong>Try it this week</strong><span>Notice work that makes you think “Not this again”. Compare frequency, time spent and how easy it is to check.</span></div>`},
  {id:'map',tag:'Automation / Map',title:'Draw the work before you build the workflow.',teaser:'A six-part map reveals where people, controls and exceptions must sit.',
   body:()=>`<p class="lede" style="margin-bottom:-6px">Tap each part to see the question to ask.</p>`+rvWrap([
     rv('Trigger','<p class="ans">What starts it?</p>',{n:1}),rv('Inputs','<p class="ans">What is needed?</p>',{n:2}),rv('Work','<p class="ans">What is fixed?</p>',{n:3}),
     rv('Judgement','<p class="ans">Where is interpretation?</p>',{n:4}),rv('Output','<p class="ans">What does good look like?</p>',{n:5}),rv('Exceptions','<p class="ans">What stops or escalates?</p>',{n:6})].join(''),'three')
     +`<div class="grid2"><div class="card"><p class="k">Define success</p><p>Accuracy, time saved, review effort and unacceptable errors.</p></div>
     <div class="card"><p class="k">Plan exceptions</p><p>Missing data, unusual formats, uncertainty or failed connections go to a person.</p></div></div>`},
  {id:'method',tag:'Automation / Select',title:'Use the simplest method that works.',teaser:'Not every repetitive task needs AI, and not every AI workflow needs an agent.',

     rv('<span class="small" style="display:block">Rules</span>Plain no-code automation','<p class="ans">Fixed and predictable steps.</p><p>A submitted form creates a row; a finished task sends a Teams notification.</p>'),

     +`<div class="banner"><strong>The decision rule</strong><span>If rules can do the job, do not add generative AI. Start by automating one useful step.</span></div>`},
  {id:'control',tag:'Automation / Control',title:'Keep a person in control where it matters.',teaser:'The higher the impact of an error, the stronger the review and approval should be.',
   body:()=>rvWrap([
     rv('Approve high-impact actions','<p>A person must approve external communications, customer commitments, spending, deleting information, changes to important records and actions involving employees or sensitive data.</p>',{n:1}),
     rv('Limit the access','<p>Connect only the systems needed. Grant only the permissions required for the task.</p>',{n:2}),
     rv('Plan the stop button','<p>Name the person who can pause the process. Know how to recover affected work and whether actions can be reversed. Before any agent goes live, it needs a kill-switch, logging, defined scope limits, and someone responsible if something goes wrong.</p>',{n:3})].join(''),'one')

  {id:'run',tag:'Automation / Run',title:'Pilot it. Document it. Keep it healthy.',teaser:'A good workflow needs ownership, testing and ongoing checks after it goes live.',

const ORDER=['safe','prompting','automation'];
const SHORT={start:'First five minutes',rules:'Five rules',access:'Get access',checks:'Four checks',tcrei:'TCREI',brief:'Better brief',order:'Key point first',specific:'Get specific',examples:'Examples and steps',pressure:'Pressure-test',offtrack:'Off-track',reset:'New chat',choose:'Choose',map:'Map',method:'Method',control:'Control',run:'Run'};


/* views */
const hero=(c)=>`<section class="chap"><div class="wrap"><div><p class="tag">${c.tag}</p><p class="big" aria-hidden="true">${c.n}</p><h1 tabindex="-1">${c.title[0]}<br>${c.title[1]}</h1><p class="lede">${c.lede}</p></div><figure class="chap-art"><img src="${c.img}" alt="${c.alt}"></figure></div></section>`;

function homeView(){
  const paths=ORDER.map((k,i)=>{const c=CH[k];return `<a class="path ch-${k}" href="#${k}"><span class="num">${c.n}</span><h3>${c.nav}</h3><p>${c.home}</p><span class="small">${c.topics.length} topics</span><span class="go">Go to section ${ARROW}</span></a>`}).join('');
  return `<div class="enter">
  <section class="hero"><div class="wrap"><div>
    <p class="tag">For people, by people</p>
    <h1 tabindex="-1">Embracing AI.</h1>
    <span class="pill">AI Playbook</span>
    <p class="tagline">Make AI useful.<br>Keep it human.</p>
    <p class="lede">A visual, beginner-friendly playbook for safe use, better prompts and smarter automation.</p></div>
    <div class="hero-art"><img src="${IMG.BRAIN}" alt="Embracing AI Playbook: a brain, half natural and half made of glowing circuits"></div></div></section>
  <section class="sec"><div class="wrap">
    <div class="sec-head"><h2>What do you need to do today?</h2><p class="lede">No need to read this playbook from cover to cover. Pick the job you need help with, then come back whenever you need a refresher.</p></div>
    <div class="paths">${paths}</div>
    <div class="strip"><div><p class="small" style="color:#C9BBE8">Your desk-side cheat sheet</p><h3>Four prompts worth keeping close.</h3><p>Starting points you can copy in one tap. Adapt them to your task and remember the Atlas guardrails.</p></div><a class="btn light" href="#cheatsheet">Open the cheat sheet ${ARROW}</a></div>
  </div></section>
</div>`;
}

function chapterView(k){
  const c=CH[k];
  const tiles=c.topics.map(t=>`<a class="tile" href="#${k}-${t.id}"><span class="k">${t.tag}</span><h3>${t.title}</h3><p>${t.teaser}</p><span class="foot"><span class="go">Open ${ARROW}</span>${seen.has(k+t.id)?`<span class="seen">${TICK} Viewed</span>`:''}</span></a>`).join('');
  return `<div class="enter ch-${k}">${hero(c)}<section class="sec"><div class="wrap"><div class="sec-head"><h2>Pick a topic</h2><p class="lede">Open only what you need.</p></div><div class="tiles">${tiles}</div></div></section></div>`;
}

function topicView(k,t){
  const c=CH[k];seen.add(k+t.id);
  const idx=c.topics.indexOf(t);
  const prev=idx>0?c.topics[idx-1]:null,next=idx<c.topics.length-1?c.topics[idx+1]:null;
  const nextCh=ORDER[ORDER.indexOf(k)+1];
  const sw=c.topics.map(x=>`<a href="#${k}-${x.id}" ${x===t?'aria-current="page"':''}>${SHORT[x.id]}</a>`).join('');
  const prevBtn=prev?`<a class="btn ghost" href="#${k}-${prev.id}">Previous: ${prev.title.replace(/\.$/,'')}</a>`:`<a class="btn ghost" href="#${k}">All topics</a>`;
  const nextBtn=next?`<a class="btn" href="#${k}-${next.id}">Next: ${next.title.replace(/\.$/,'')} ${ARROW}</a>`:(nextCh?`<a class="btn" href="#${nextCh}">Continue to ${CH[nextCh].nav.toLowerCase()} ${ARROW}</a>`:`<a class="btn" href="#cheatsheet">Open the cheat sheet ${ARROW}</a>`);
  return `<div class="enter ch-${k}"><div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span aria-hidden="true">/</span><a href="#${k}">${c.nav}</a></nav>
    <div class="switch" aria-label="Topics in this section">${sw}</div>
    <header class="topic-head"><p class="tag">${t.tag}</p><h1 tabindex="-1">${t.title}</h1><p class="lede">${t.teaser}</p></header>
    <div class="topic-body">${t.body()}</div>
    <div class="pager">${prevBtn}${nextBtn}</div></div></div>`;
}

function cheatView(){
  const items=[
   ['Start a task','“I need [task]. The audience is [audience]. Use [format]. Priorities are [constraints].”','prompting-tcrei','See the TCREI method'],
   ['Challenge an answer','“State your assumptions, the strongest trade-offs and evidence you relied on. Flag what is uncertain.”','prompting-pressure','See how to pressure-test'],
   ['Ask for a better draft','“What are the weakest parts of this result? Suggest improvements, then revise only those parts.”','prompting-offtrack','See how to steer it back'],
   ['Hand off to a new chat','“Summarise the goal, status, decisions, constraints, work done, open questions and next step.”','prompting-reset','See when to reset']];
  const cards=items.map(i=>`<div class="card"><p class="k">${i[0]}</p>${copyBlock('',i[1])}<a class="go" href="#${i[2]}" style="margin-top:4px">${i[3]} ${ARROW}</a></div>`).join('');
  return `<div class="enter ch-cheatsheet"><div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span aria-hidden="true">/</span><span>Cheat sheet</span></nav>
    <header class="topic-head"><p class="tag">Your desk-side cheat sheet</p><h1 tabindex="-1">Four prompts worth keeping close.</h1><p class="lede">These work as starting points. Adapt them to your task and remember the Atlas guardrails.</p></header>
    <div class="grid2" style="padding-bottom:56px">${cards}</div></div></div>`;
}

/* routing */
const app=document.getElementById('app');
let first=true;
function route(){
  const raw=decodeURIComponent(location.hash.slice(1));
  const i=raw.indexOf('-');const c=i<0?raw:raw.slice(0,i);const t=i<0?'':raw.slice(i+1);
  let html,active='home';
  if(c==='cheatsheet'){html=cheatView();active='cheatsheet'}
  else if(CH[c]){const tp=CH[c].topics.find(x=>x.id===t);html=tp?topicView(c,tp):chapterView(c);active=c}
  else html=homeView();
  app.innerHTML=html;
  document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  document.title=(active==='home'?'Embracing AI':'Embracing AI | '+(CH[active]?CH[active].short:'Cheat sheet'));
  window.scrollTo(0,0);
  if(!first){const h=app.querySelector('h1');if(h)h.focus({preventScroll:true})}
  first=false;
}
window.addEventListener('hashchange',route);

/* interactions */
const TC=[['Task','Say exactly what you want.'],['Context','Give the audience, constraints, details and format.'],['References','Show the style, structure or example to follow.'],['Evaluate','Check accuracy, relevance and usability.'],['Iterate','Refine the brief, feedback or missing detail.']];
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e2){}ta.remove();return ok}
}
app.addEventListener('click',async e=>{
  const b=e.target.closest('.rv-btn');
  if(b){const r=b.closest('.rv');const o=r.classList.toggle('open');b.setAttribute('aria-expanded',o);return}
  const all=e.target.closest('[data-all]');
  if(all){const set=all.closest('.rv-set');const open=all.dataset.all==='open';
    set.querySelectorAll('.rv').forEach(r=>{r.classList.toggle('open',open);r.querySelector('.rv-btn').setAttribute('aria-expanded',open)});
    all.dataset.all=open?'close':'open';all.textContent=open?'Hide all':'Show all';return}
  const cp=e.target.closest('.copy-btn');
  if(cp){const txt=cp.parentElement.querySelector('.ptext').textContent.trim().replace(/^[“"]|[”"]$/g,'');
    const ok=await copyText(txt);const s=cp.querySelector('span');s.textContent=ok?'Copied':'Select the text to copy';
    setTimeout(()=>{s.textContent='Copy'},1800);return}
  const tc=e.target.closest('[data-tc]');
  if(tc){const n=+tc.dataset.tc;document.querySelectorAll('[data-tc]').forEach(x=>x.setAttribute('aria-pressed',x===tc));
    document.getElementById('tcW').textContent=TC[n][0];document.getElementById('tcD').textContent=TC[n][1];return}
  const cl=e.target.closest('[data-clear]');
  if(cl){const vc=document.querySelector('.vc');const o=vc.dataset.open!=='true';vc.dataset.open=o;cl.setAttribute('aria-expanded',o);
    cl.textContent=o?'Hide the clearer brief':'Show the clearer brief'}
});
route();
</script>
</body>
</html>
